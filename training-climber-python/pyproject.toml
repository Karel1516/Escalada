[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "climber-training"
version = "0.1.0"
description = "Sistema local, versionado y auditable de prescripción para escalada"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "PySide6>=6.7,<7",
  "jsonschema>=4.23,<5",
  "platformdirs>=4.3,<5",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "pytest-qt>=4.4", "pyinstaller>=6.10"]

[project.scripts]
entrenamiento-escalada = "climber_training.main:main"
climber-rules = "climber_training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/climber_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
